<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Time — Notion widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }

:root {
  --card: #ffffff;
  --card-2: #fbf9f5;
  --ink: #2b2a27;
  --ink-rgb: 43, 42, 39;
  --ink-soft: #9c968a;
  --ink-faint: #c9c3b8;
  --track: #ece7dd;

  /* ---- shared design system (identical in both widgets) ----
     One rhythm unit drives every size below, so type, spacing and the ring
     shrink and grow together. Sizing each value with its own clamp() lets the
     small text bottom out while larger elements keep scaling, which is what
     made the layout drift out of proportion at narrow widths. */
  --u: clamp(15px, 3.6cqw, 19px);

  /* Body/UI copy stays on a plain, neutral grotesk. The hero numerals get
     their own face: Baloo 2 is rounded and warm rather than technical, which
     fits the mascot/flame/sparkle tone instead of fighting it. */
  --font-sans: 'Plus Jakarta Sans', ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-h1: 'Baloo 2', var(--font-sans);

  /* ---- type scale: H1-H4 + body, see the rules table shared alongside
     this file for what each level is for. Every element in the widget maps
     to exactly one of these five - nothing gets a one-off size. ---- */
  --fs-h1:   calc(var(--u) * 2.75);  /* hero readout (the clock) */
  --fs-h2:   calc(var(--u) * 1.15);  /* card heading */
  --fs-h3:   calc(var(--u) * 1.0);   /* control label: buttons, tabs */
  --fs-h4:   calc(var(--u) * 0.75);  /* micro caption: every small supporting label */
  --fs-body: calc(var(--u) * 0.95);  /* paragraph copy */
  --fs-icon: calc(var(--u) * 0.68);  /* decorative glyphs only - not part of the text scale */

  --sp-1: calc(var(--u) * 0.5);
  --sp-2: calc(var(--u) * 1);
  --sp-3: calc(var(--u) * 1.75);
  --sp-4: calc(var(--u) * 2.75);
  --pad-card-y: calc(var(--u) * 2.25);
  --pad-card-x: calc(var(--u) * 1.5);

  --radius: calc(var(--u) * 1.35);

  --border: rgba(43, 42, 39, 0.08);
  --shadow: 0 1px 2px rgba(43,42,39,0.04), 0 6px 14px -6px rgba(43,42,39,0.18);
  --shadow-sm: 0 1px 2px rgba(43,42,39,0.05), 0 3px 8px -4px rgba(43,42,39,0.16);
}

@media (prefers-color-scheme: dark) {
  :root {
    --card: #262420;
    --card-2: #2c2a25;
    --ink: #f0ede6;
    --ink-rgb: 240, 237, 230;
    --ink-soft: #8f8a7e;
    --ink-faint: #4a473f;
    --track: #38352e;
    --border: rgba(240, 237, 230, 0.08);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 14px -6px rgba(0,0,0,0.55);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3), 0 3px 8px -4px rgba(0,0,0,0.5);
  }
}

html { margin: 0; height: 100%; }

body {
  margin: 0;
  min-height: 100%;
  background: transparent;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 2px 6px 6px;
  font-family: var(--font-sans);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

/* The card sits INSIDE the container rather than being it: cqw units can't
   query the element that declares container-type, so a self-declaring card
   silently falls back to viewport units and padding stops tracking the box. */
.shell {
  container-type: inline-size;
  width: 100%;
  max-width: 520px;
}

.widget {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: var(--pad-card-y) var(--pad-card-x);
}

.head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
}

.title {
  font-size: var(--fs-h2);
  font-weight: 700;
  letter-spacing: -0.01em;
}

.date-label {
  font-size: var(--fs-h4);
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--ink-soft);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.clock-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: calc(var(--u) * 0.6);
  margin-bottom: var(--sp-4);
}

.flap {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: calc(var(--u) * 0.9);
  box-shadow: var(--shadow-sm);
  padding: calc(var(--u) * 0.85) 0 calc(var(--u) * 0.6);
  text-align: center;
}

.flap-divider {
  width: calc(100% - var(--u) * 1.5);
  height: 1px;
  background: var(--border);
  margin: calc(var(--u) * 0.7) 0;
}

.flap-num {
  font-family: var(--font-h1);
  font-size: var(--fs-h1);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}

.flap-label {
  font-size: var(--fs-h4);
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--ink-soft);
}

.colon {
  font-family: var(--font-h1);
  font-size: calc(var(--u) * 1.1);
  font-weight: 700;
  color: var(--ink-faint);
  padding-bottom: calc(var(--u) * 0.75);
}

.stats {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.stat {
  display: grid;
  grid-template-columns: calc(var(--u) * 3) 1fr calc(var(--u) * 2);
  align-items: center;
  gap: calc(var(--u) * 0.75);
}

.stat-label {
  font-size: var(--fs-h4);
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--ink-soft);
}

.stat-track {
  height: calc(var(--u) * 0.6);
  border-radius: 999px;
  background: var(--track);
  overflow: hidden;
}

.stat-fill {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(var(--ink-rgb), 0.5), rgba(var(--ink-rgb), 0.9));
  transition: width 0.6s ease;
}

.stat-pct {
  font-size: var(--fs-h4);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-align: right;
}
</style>
</head>
<body>

<div class="shell">
  <div class="widget">
  <div class="head">
    <span class="title">Time</span>
    <span class="date-label" id="dateLabel">--- -- ---</span>
  </div>

  <div class="clock-row">
    <div class="flap">
      <div class="flap-num" id="hour">--</div>
      <div class="flap-divider"></div>
      <div class="flap-label" id="ampm">--</div>
    </div>
    <span class="colon">:</span>
    <div class="flap">
      <div class="flap-num" id="minute">--</div>
      <div class="flap-divider"></div>
      <div class="flap-label">Min</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="stat-label">Year</span>
      <span class="stat-track"><span class="stat-fill" id="year-fill" style="width:0%"></span></span>
      <span class="stat-pct" id="year-pct">0%</span>
    </div>
    <div class="stat">
      <span class="stat-label">Month</span>
      <span class="stat-track"><span class="stat-fill" id="month-fill" style="width:0%"></span></span>
      <span class="stat-pct" id="month-pct">0%</span>
    </div>
    <div class="stat">
      <span class="stat-label">Week</span>
      <span class="stat-track"><span class="stat-fill" id="week-fill" style="width:0%"></span></span>
      <span class="stat-pct" id="week-pct">0%</span>
    </div>
    <div class="stat">
      <span class="stat-label">Day</span>
      <span class="stat-track"><span class="stat-fill" id="day-fill" style="width:0%"></span></span>
      <span class="stat-pct" id="day-pct">0%</span>
    </div>
  </div>
  </div>
</div>

<script>
  const currentTz = Intl.DateTimeFormat().resolvedOptions().timeZone;

  const WEEKDAY_LABELS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const MONTH_LABELS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const dateLabelEl = document.getElementById("dateLabel");

  function getZonedNow(tz) {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: tz,
      hourCycle: "h23",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
    }).formatToParts(new Date());

    const map = {};
    parts.forEach((p) => {
      if (p.type !== "literal") map[p.type] = parseInt(p.value, 10);
    });

    return new Date(Date.UTC(map.year, map.month - 1, map.day, map.hour, map.minute, map.second, new Date().getMilliseconds()));
  }

  let zoneOffsetMs = 0;

  function syncZoneOffset() {
    zoneOffsetMs = getZonedNow(currentTz).getTime() - Date.now();
  }

  function getZonedNowFast() {
    return new Date(Date.now() + zoneOffsetMs);
  }

  function isLeapYear(y) {
    return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
  }

  function daysInYear(y) {
    return isLeapYear(y) ? 366 : 365;
  }

  function daysInMonth(y, m) {
    return new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  }

  const hourEl = document.getElementById("hour");
  const ampmEl = document.getElementById("ampm");
  const minuteEl = document.getElementById("minute");

  function renderClockFace() {
    const zoned = getZonedNowFast();
    let h24 = zoned.getUTCHours();
    const ampm = h24 >= 12 ? "PM" : "AM";
    let h12 = h24 % 12;
    if (h12 === 0) h12 = 12;
    hourEl.textContent = String(h12).padStart(2, "0");
    ampmEl.textContent = ampm;
    minuteEl.textContent = String(zoned.getUTCMinutes()).padStart(2, "0");

    const weekday = WEEKDAY_LABELS[zoned.getUTCDay()];
    const month = MONTH_LABELS[zoned.getUTCMonth()];
    dateLabelEl.textContent = `${weekday}, ${zoned.getUTCDate()} ${month}`;
  }

  function renderStats() {
    const zoned = getZonedNowFast();
    const dayMs = 24 * 60 * 60 * 1000;

    const dayStart = Date.UTC(zoned.getUTCFullYear(), zoned.getUTCMonth(), zoned.getUTCDate());
    const dayPct = ((zoned.getTime() - dayStart) / dayMs) * 100;

    const weekday = (zoned.getUTCDay() + 6) % 7;
    const weekStart = dayStart - weekday * dayMs;
    const weekPct = ((zoned.getTime() - weekStart) / (7 * dayMs)) * 100;

    const y = zoned.getUTCFullYear();
    const mDays = daysInMonth(y, zoned.getUTCMonth());
    const monthStart = Date.UTC(y, zoned.getUTCMonth(), 1);
    const monthPct = ((zoned.getTime() - monthStart) / (mDays * dayMs)) * 100;

    const yearStart = Date.UTC(y, 0, 1);
    const yearPct = ((zoned.getTime() - yearStart) / (daysInYear(y) * dayMs)) * 100;

    setStat("day", dayPct);
    setStat("week", weekPct);
    setStat("month", monthPct);
    setStat("year", yearPct);
  }

  function setStat(id, pct) {
    const clamped = Math.max(0, Math.min(100, pct));
    document.getElementById(id + "-fill").style.width = clamped.toFixed(1) + "%";
    document.getElementById(id + "-pct").textContent = Math.round(clamped) + "%";
  }

  function alignedStart(fn, intervalMs) {
    fn();
    const drift = Date.now() % intervalMs;
    setTimeout(() => {
      fn();
      setInterval(fn, intervalMs);
    }, intervalMs - drift);
  }

  syncZoneOffset();
  renderStats();
  alignedStart(renderClockFace, 1000);
  setInterval(renderStats, 1000 * 15);
  setInterval(syncZoneOffset, 1000 * 30);
</script>

</body>
</html>
