<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Time — Notion widget</title>
<style>
  :root {
    --bg-page: #f5f2ec;
    --card: #ffffff;
    --card-2: #fbf9f5;
    --ink: #2b2a27;
    --ink-rgb: 43, 42, 39;
    --ink-soft: #9c968a;
    --ink-faint: #c9c3b8;
    --track: #ece7dd;
    --border: rgba(43, 42, 39, 0.08);
    --shadow: 0 1px 2px rgba(43, 42, 39, 0.04), 0 12px 28px -14px rgba(43, 42, 39, 0.18);
    --flap-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 -1px 0 rgba(43,42,39,0.06) inset, 0 6px 14px -8px rgba(43,42,39,0.22);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-page: #1d1c19;
      --card: #262420;
      --card-2: #2c2a25;
      --ink: #f0ede6;
      --ink-rgb: 240, 237, 230;
      --ink-soft: #8f8a7e;
      --ink-faint: #4a473f;
      --track: #38352e;
      --border: rgba(240, 237, 230, 0.08);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 16px 32px -16px rgba(0, 0, 0, 0.6);
      --flap-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 -1px 0 rgba(0,0,0,0.3) inset, 0 6px 14px -8px rgba(0,0,0,0.5);
    }
  }

  :root[data-theme="dark"] {
    --bg-page: #1d1c19;
    --card: #262420;
    --card-2: #2c2a25;
    --ink: #f0ede6;
    --ink-rgb: 240, 237, 230;
    --ink-soft: #8f8a7e;
    --ink-faint: #4a473f;
    --track: #38352e;
    --border: rgba(240, 237, 230, 0.08);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 16px 32px -16px rgba(0, 0, 0, 0.6);
    --flap-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 -1px 0 rgba(0,0,0,0.3) inset, 0 6px 14px -8px rgba(0,0,0,0.5);
  }
  :root[data-theme="light"] {
    --bg-page: #f5f2ec;
    --card: #ffffff;
    --card-2: #fbf9f5;
    --ink: #2b2a27;
    --ink-rgb: 43, 42, 39;
    --ink-soft: #9c968a;
    --ink-faint: #c9c3b8;
    --track: #ece7dd;
    --border: rgba(43, 42, 39, 0.08);
    --shadow: 0 1px 2px rgba(43, 42, 39, 0.04), 0 12px 28px -14px rgba(43, 42, 39, 0.18);
    --flap-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 -1px 0 rgba(43,42,39,0.06) inset, 0 6px 14px -8px rgba(43,42,39,0.22);
  }

  * { box-sizing: border-box; }

  html {
    margin: 0;
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100%;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .widget {
    container-type: inline-size;
    width: 100%;
    max-width: clamp(280px, 40vw, 560px);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: clamp(22px, 6.5cqw, 34px) clamp(18px, 5.2cqw, 30px);
  }

  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: clamp(16px, 5.5cqw, 26px);
  }

  .title {
    font-size: clamp(13px, 3.1cqw, 17px);
    font-weight: 650;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .date-label {
    font-size: clamp(8px, 1.9cqw, 9.5px);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .clock-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2.8cqw, 14px);
    margin-bottom: clamp(36px, 10.5cqw, 52px);
  }

  .flap {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 15px;
    box-shadow: var(--flap-shadow);
    padding: clamp(10px, 3.1cqw, 16px) 0 clamp(8px, 2.3cqw, 11px);
    text-align: center;
  }

  .flap-divider {
    width: calc(100% - 24px);
    height: 1px;
    background: var(--border);
    margin: clamp(8px, 2.6cqw, 13px) 0;
  }

  .flap-num {
    font-size: clamp(20px, 9cqw, 46px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  .flap-label {
    font-size: clamp(8px, 2cqw, 10px);
    font-weight: 650;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .colon {
    font-size: clamp(14px, 4.4cqw, 19px);
    font-weight: 700;
    color: var(--ink-faint);
    padding-bottom: clamp(9px, 2.8cqw, 13px);
  }

  .stats {
    display: flex;
    flex-direction: column;
    gap: clamp(13px, 4.2cqw, 19px);
  }

  .stat {
    display: grid;
    grid-template-columns: clamp(38px, 11cqw, 50px) 1fr clamp(26px, 7.4cqw, 32px);
    align-items: center;
    gap: clamp(8px, 2.8cqw, 13px);
  }

  .stat-label {
    font-size: clamp(9px, 2.1cqw, 10.5px);
    font-weight: 650;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .stat-track {
    height: clamp(8px, 2.2cqw, 10px);
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
  }

  .stat-fill {
    display: block;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(var(--ink-rgb), 0.5), rgba(var(--ink-rgb), 0.9));
    transition: width 0.6s ease;
  }

  .stat-pct {
    font-size: clamp(10.5px, 2.5cqw, 12.5px);
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: var(--ink);
  }
</style>
</head>
<body>

<div class="widget">
  <div class="head">
    <span class="title">Time</span>
    <span class="date-label" id="dateLabel">--- -- ---</span>
  </div>

  <div class="clock-row">
    <div class="flap">
      <div class="flap-num" id="hour">--</div>
      <div class="flap-divider"></div>
      <div class="flap-label" id="ampm">--</div>
    </div>
    <span class="colon">:</span>
    <div class="flap">
      <div class="flap-num" id="minute">--</div>
      <div class="flap-divider"></div>
      <div class="flap-label">Min</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="stat-label">Year</span>
      <span class="stat-track"><span class="stat-fill" id="year-fill" style="width:0%"></span></span>
      <span class="stat-pct" id="year-pct">0%</span>
    </div>
    <div class="stat">
      <span class="stat-label">Month</span>
      <span class="stat-track"><span class="stat-fill" id="month-fill" style="width:0%"></span></span>
      <span class="stat-pct" id="month-pct">0%</span>
    </div>
    <div class="stat">
      <span class="stat-label">Week</span>
      <span class="stat-track"><span class="stat-fill" id="week-fill" style="width:0%"></span></span>
      <span class="stat-pct" id="week-pct">0%</span>
    </div>
    <div class="stat">
      <span class="stat-label">Day</span>
      <span class="stat-track"><span class="stat-fill" id="day-fill" style="width:0%"></span></span>
      <span class="stat-pct" id="day-pct">0%</span>
    </div>
  </div>
</div>

<script>
  const currentTz = Intl.DateTimeFormat().resolvedOptions().timeZone;

  const WEEKDAY_LABELS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  const MONTH_LABELS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  const dateLabelEl = document.getElementById("dateLabel");

  function getZonedNow(tz) {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: tz,
      hourCycle: "h23",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
    }).formatToParts(new Date());

    const map = {};
    parts.forEach((p) => {
      if (p.type !== "literal") map[p.type] = parseInt(p.value, 10);
    });

    return new Date(Date.UTC(map.year, map.month - 1, map.day, map.hour, map.minute, map.second, new Date().getMilliseconds()));
  }

  let zoneOffsetMs = 0;

  function syncZoneOffset() {
    zoneOffsetMs = getZonedNow(currentTz).getTime() - Date.now();
  }

  function getZonedNowFast() {
    return new Date(Date.now() + zoneOffsetMs);
  }

  function isLeapYear(y) {
    return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
  }

  function daysInYear(y) {
    return isLeapYear(y) ? 366 : 365;
  }

  function daysInMonth(y, m) {
    return new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  }

  const hourEl = document.getElementById("hour");
  const ampmEl = document.getElementById("ampm");
  const minuteEl = document.getElementById("minute");

  function renderClockFace() {
    const zoned = getZonedNowFast();
    let h24 = zoned.getUTCHours();
    const ampm = h24 >= 12 ? "PM" : "AM";
    let h12 = h24 % 12;
    if (h12 === 0) h12 = 12;
    hourEl.textContent = String(h12).padStart(2, "0");
    ampmEl.textContent = ampm;
    minuteEl.textContent = String(zoned.getUTCMinutes()).padStart(2, "0");

    const weekday = WEEKDAY_LABELS[zoned.getUTCDay()];
    const month = MONTH_LABELS[zoned.getUTCMonth()];
    dateLabelEl.textContent = `${weekday}, ${zoned.getUTCDate()} ${month}`;
  }

  function renderStats() {
    const zoned = getZonedNowFast();
    const dayMs = 24 * 60 * 60 * 1000;

    const dayStart = Date.UTC(zoned.getUTCFullYear(), zoned.getUTCMonth(), zoned.getUTCDate());
    const dayPct = ((zoned.getTime() - dayStart) / dayMs) * 100;

    const weekday = (zoned.getUTCDay() + 6) % 7;
    const weekStart = dayStart - weekday * dayMs;
    const weekPct = ((zoned.getTime() - weekStart) / (7 * dayMs)) * 100;

    const y = zoned.getUTCFullYear();
    const mDays = daysInMonth(y, zoned.getUTCMonth());
    const monthStart = Date.UTC(y, zoned.getUTCMonth(), 1);
    const monthPct = ((zoned.getTime() - monthStart) / (mDays * dayMs)) * 100;

    const yearStart = Date.UTC(y, 0, 1);
    const yearPct = ((zoned.getTime() - yearStart) / (daysInYear(y) * dayMs)) * 100;

    setStat("day", dayPct);
    setStat("week", weekPct);
    setStat("month", monthPct);
    setStat("year", yearPct);
  }

  function setStat(id, pct) {
    const clamped = Math.max(0, Math.min(100, pct));
    document.getElementById(id + "-fill").style.width = clamped.toFixed(1) + "%";
    document.getElementById(id + "-pct").textContent = Math.round(clamped) + "%";
  }

  function alignedStart(fn, intervalMs) {
    fn();
    const drift = Date.now() % intervalMs;
    setTimeout(() => {
      fn();
      setInterval(fn, intervalMs);
    }, intervalMs - drift);
  }

  syncZoneOffset();
  renderStats();
  alignedStart(renderClockFace, 1000);
  setInterval(renderStats, 1000 * 15);
  setInterval(syncZoneOffset, 1000 * 30);
</script>

</body>
</html>
