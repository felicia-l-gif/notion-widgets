<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Progress</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }
  .tp-wrap {
    --ink: #3F3F3F;
    --track: #E2E2E2;
    --fill: #6B6B6B;
    --fill-soft: #9E9E9E;
    font-family: -apple-system, "Inter", "Segoe UI", sans-serif;
    color: var(--ink);
    padding: 12px 14px;
    max-width: 420px;
    box-sizing: border-box;
    background: #F9F8F7;
    border-radius: 16px;
    overflow: hidden;
  }
  .tp-row {
    display: grid;
    grid-template-columns: 68px 1fr 44px;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .tp-label {
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #8A8A8A;
    font-weight: 600;
  }
  .tp-track {
    height: 10px;
    background: var(--track);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .tp-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--fill-soft), var(--fill));
    transition: width 0.6s ease;
  }
  .tp-pct {
    font-size: 13px;
    font-weight: 400;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<div class="tp-wrap" id="tp-root">
  <div class="tp-row"><div class="tp-label">Year</div><div class="tp-track"><div class="tp-fill" id="tp-year"></div></div><div class="tp-pct" id="tp-year-pct"></div></div>
  <div class="tp-row"><div class="tp-label">Quarter</div><div class="tp-track"><div class="tp-fill" id="tp-quarter"></div></div><div class="tp-pct" id="tp-quarter-pct"></div></div>
  <div class="tp-row"><div class="tp-label">Month</div><div class="tp-track"><div class="tp-fill" id="tp-month"></div></div><div class="tp-pct" id="tp-month-pct"></div></div>
  <div class="tp-row"><div class="tp-label">Week</div><div class="tp-track"><div class="tp-fill" id="tp-week"></div></div><div class="tp-pct" id="tp-week-pct"></div></div>
  <div class="tp-row"><div class="tp-label">Day</div><div class="tp-track"><div class="tp-fill" id="tp-day"></div></div><div class="tp-pct" id="tp-day-pct"></div></div>
</div>
<script>
(function () {
  function pct(elapsed, total) {
    return Math.min(100, Math.max(0, (elapsed / total) * 100));
  }
  function set(id, value) {
    var fill = document.getElementById(id);
    var label = document.getElementById(id + "-pct");
    if (fill) fill.style.width = value.toFixed(0) + "%";
    if (label) label.textContent = value.toFixed(0) + "%";
  }
  function update() {
    var now = new Date();
    var startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    set("tp-day", pct(now - startOfDay, 24 * 60 * 60 * 1000));
    var dow = (now.getDay() + 6) % 7;
    var startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow);
    set("tp-week", pct(now - startOfWeek, 7 * 24 * 60 * 60 * 1000));
    var startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    var startOfNextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    set("tp-month", pct(now - startOfMonth, startOfNextMonth - startOfMonth));
    var qStartMonth = Math.floor(now.getMonth() / 3) * 3;
    var startOfQuarter = new Date(now.getFullYear(), qStartMonth, 1);
    var startOfNextQuarter = new Date(now.getFullYear(), qStartMonth + 3, 1);
    set("tp-quarter", pct(now - startOfQuarter, startOfNextQuarter - startOfQuarter));
    var startOfYear = new Date(now.getFullYear(), 0, 1);
    var startOfNextYear = new Date(now.getFullYear() + 1, 0, 1);
    set("tp-year", pct(now - startOfYear, startOfNextYear - startOfYear));
  }
  update();
  setInterval(update, 60 * 1000);
})();
</script>
</body>
</html>
